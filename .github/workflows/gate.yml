name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # macOS, and not for the platform's sake: the visual snapshots are pixels,
    # and pixels are a function of the font rasteriser. Baselines taken on a Mac
    # and compared on Linux differ everywhere there is text, which is a suite
    # that fails on every run and is therefore a suite nobody reads.
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # No `version` here on purpose. `packageManager` in `package.json` is the
      # one place that says which pnpm this project is built with, and it says
      # it to corepack on a developer's machine as well as to this action — a
      # version pinned in the workflow would be a second place to remember, and
      # the one that silently disagrees.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # An LTS the runners actually carry, and comfortably inside the
          # `engines` range. Nothing here needs the newest Node; the app ships
          # with Electron's own.
          node-version: 24
          cache: pnpm

      # `make install` rather than `pnpm install`: better-sqlite3 is compiled
      # against Electron's ABI, and a plain install leaves it built for Node —
      # which fails at the first query rather than at install time.
      - run: make install

      - run: make gate

      # The traces are the only way to read a failure that did not reproduce
      # locally, and Playwright writes them only for the tests that failed.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: traces
          path: test-results/
          retention-days: 7
